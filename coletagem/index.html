<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2a3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Coletagem Frios · Trevo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #eef3f7;
      --bg-deep: #d9e3ec;
      --ink: #142033;
      --ink-soft: #4a5d72;
      --accent: #1c4d6e;
      --accent-deep: #0f2f44;
      --cream: #f7fafc;
      --line: #b8c9d6;
      --ok: #1a6b4a;
      --warn: #9a5b1a;
      --entrada: #1a6b4a;
      --adicional: #1c4d6e;
      --volta: #8a4b16;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 100% 70% at 0% -10%, #c5d9e8 0%, transparent 50%),
        radial-gradient(ellipse 80% 50% at 100% 0%, #d5e4ef 0%, transparent 45%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      padding: calc(1.1rem + var(--safe-top)) 1rem calc(7.5rem + var(--safe-bottom));
    }

    .wrap { max-width: 28rem; margin: 0 auto; }

    header { margin-bottom: 1.15rem; animation: rise 0.4s ease-out both; }

    .brand {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--accent-deep);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 0.3rem;
      font-size: 0.92rem;
      color: var(--ink-soft);
      line-height: 1.35;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      margin-top: 0.95rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
    }

    .field.full { grid-column: 1 / -1; }

    .field input, .field select {
      font: inherit;
      font-size: 1rem;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      color: var(--ink);
      background: var(--cream);
      border: 1.5px solid var(--line);
      border-radius: 0.65rem;
      padding: 0.65rem 0.75rem;
      width: 100%;
      -webkit-appearance: none;
    }

    .field input:focus, .field select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .tipo-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      margin: 1rem 0 0.85rem;
      animation: rise 0.4s 0.05s ease-out both;
    }

    .tipo-tabs button {
      font: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.75rem 0.35rem;
      border-radius: 0.7rem;
      border: 1.5px solid var(--line);
      background: var(--cream);
      color: var(--ink-soft);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .tipo-tabs button.active[data-tipo="entrada"] {
      background: #e6f4ed;
      border-color: var(--entrada);
      color: var(--entrada);
    }
    .tipo-tabs button.active[data-tipo="adicional"] {
      background: #e6eef5;
      border-color: var(--adicional);
      color: var(--adicional);
    }
    .tipo-tabs button.active[data-tipo="volta"] {
      background: #f7eee4;
      border-color: var(--volta);
      color: var(--volta);
    }

    .scan-box {
      background: var(--cream);
      border: 1.5px solid var(--line);
      border-radius: 0.95rem;
      padding: 0.85rem;
      margin-bottom: 0.85rem;
      animation: rise 0.4s 0.08s ease-out both;
    }

    .scan-box h2 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 0.55rem;
    }

    #reader {
      width: 100%;
      border-radius: 0.65rem;
      overflow: hidden;
      display: none;
      margin-bottom: 0.65rem;
    }

    #reader.active { display: block; }

    .manual-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.45rem;
    }

    .manual-row input {
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--ink);
      background: #eef4f8;
      border: 1.5px solid var(--line);
      border-radius: 0.65rem;
      padding: 0.7rem 0.75rem;
      width: 100%;
    }

    .manual-row input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
      background: #fff;
    }

    .btn-add {
      font: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0 1rem;
      border: none;
      border-radius: 0.65rem;
      background: var(--accent-deep);
      color: #eef6fb;
      cursor: pointer;
      white-space: nowrap;
    }

    .scan-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
      margin-top: 0.55rem;
    }

    .scan-actions button {
      font: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.7rem;
      border-radius: 0.65rem;
      border: 1.5px solid var(--line);
      background: var(--cream);
      color: var(--ink);
      cursor: pointer;
    }

    .scan-actions button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .hint {
      margin-top: 0.55rem;
      font-size: 0.78rem;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    .totais {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
      animation: rise 0.4s 0.1s ease-out both;
    }

    .total-card {
      background: var(--cream);
      border: 1.5px solid var(--line);
      border-radius: 0.75rem;
      padding: 0.7rem 0.8rem;
    }

    .total-card span {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-soft);
    }

    .total-card strong {
      font-size: 1.15rem;
      color: var(--accent-deep);
    }

    .section-label {
      margin: 0.35rem 0 0.5rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .lista {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      align-items: start;
      background: var(--cream);
      border: 1.5px solid var(--line);
      border-radius: 0.8rem;
      padding: 0.75rem 0.8rem;
      animation: rise 0.3s ease-out both;
    }

    .item .nome {
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.25;
    }

    .item .meta-line {
      margin-top: 0.2rem;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    .item .peso {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-deep);
      text-align: right;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.4rem;
      border-radius: 0.35rem;
      margin-top: 0.35rem;
    }

    .badge.entrada { background: #e6f4ed; color: var(--entrada); }
    .badge.adicional { background: #e6eef5; color: var(--adicional); }
    .badge.volta { background: #f7eee4; color: var(--volta); }

    .item-actions {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
    }

    .item-actions button {
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: #8a3a3a;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.2rem 0;
    }

    .empty {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--ink-soft);
      font-size: 0.9rem;
      background: rgba(255,255,255,0.35);
      border-radius: 0.8rem;
      border: 1px dashed var(--line);
    }

    .preview {
      margin-top: 1.15rem;
      padding: 1rem;
      background: rgba(15, 47, 68, 0.06);
      border-radius: 0.85rem;
      border: 1px dashed var(--line);
    }

    .preview h2 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 0.55rem;
    }

    .preview pre {
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 0.82rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .actions {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.75rem 1rem calc(0.85rem + var(--safe-bottom));
      background: linear-gradient(180deg, transparent 0%, rgba(217, 227, 236, 0.92) 28%, var(--bg-deep) 100%);
      display: flex;
      justify-content: center;
      z-index: 20;
    }

    .actions-inner {
      width: 100%;
      max-width: 28rem;
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 0.5rem;
    }

    .actions button {
      font: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 0.85rem;
      padding: 0.95rem 0.7rem;
      cursor: pointer;
      transition: transform 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .actions button:active { transform: scale(0.97); }

    .btn-clear {
      background: var(--cream);
      color: var(--ink-soft);
      border: 1.5px solid var(--line) !important;
    }

    .btn-copy {
      background: var(--accent-deep);
      color: #eef6fb;
      box-shadow: 0 4px 16px rgba(15, 47, 68, 0.28);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(5.4rem + var(--safe-bottom));
      transform: translateX(-50%) translateY(0.5rem);
      background: var(--accent-deep);
      color: #eef6fb;
      font-weight: 600;
      font-size: 0.88rem;
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 30;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.warn { background: var(--warn); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="brand">Coletagem Frios</p>
      <p class="subtitle">Bipa cada etiqueta da Prix 5 Plus · Trevo</p>
      <div class="meta">
        <label class="field">
          Data
          <input type="date" id="data" />
        </label>
        <label class="field">
          Quem
          <input type="text" id="quem" placeholder="Seu nome" autocomplete="name" />
        </label>
      </div>
    </header>

    <div class="tipo-tabs" id="tipoTabs">
      <button type="button" data-tipo="entrada" class="active">Entrada</button>
      <button type="button" data-tipo="adicional">Adicional</button>
      <button type="button" data-tipo="volta">Volta</button>
    </div>

    <div class="scan-box">
      <h2>Ler etiqueta</h2>
      <div id="reader"></div>
      <div class="manual-row">
        <input
          type="text"
          id="codigoManual"
          inputmode="numeric"
          placeholder="Código de barras ou digite"
          autocomplete="off"
        />
        <button type="button" class="btn-add" id="btnAdd">Add</button>
      </div>
      <div class="scan-actions">
        <button type="button" class="primary" id="btnCam">Abrir câmera</button>
        <button type="button" id="btnStopCam" disabled>Parar câmera</button>
      </div>
      <p class="hint">Escolhe Entrada / Adicional / Volta e bipa. Cada etiqueta entra separada na lista.</p>
    </div>

    <div class="totais">
      <div class="total-card">
        <span>Etiquetas</span>
        <strong id="totalQtd">0</strong>
      </div>
      <div class="total-card">
        <span>Peso total</span>
        <strong id="totalKg">0,000 kg</strong>
      </div>
    </div>

    <p class="section-label">Etiquetas do dia</p>
    <div class="lista" id="lista"></div>

    <div class="preview">
      <h2>Prévia pra copiar</h2>
      <pre id="preview"></pre>
    </div>
  </div>

  <div class="actions">
    <div class="actions-inner">
      <button type="button" class="btn-clear" id="btnClear">Limpar dia</button>
      <button type="button" class="btn-copy" id="btnCopy">Copiar lista</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const STORAGE_KEY = "trevo-coletagem-frios-v1";

    /** Códigos PLU da folha / balança */
    const PRODUTOS = {
      "1117": "Açaí Premium",
      "982": "Açaí Zero",
      "101": "Cupuaçu",
      "903": "Tapioca",
    };

    /** Se a balança tiver PLU próprio pro Soft, ajuste aqui */
    const PRODUTOS_EXTRA = {
      // "XXXX": "Açaí Soft",
    };

    const TIPO_LABEL = {
      entrada: "Entrada",
      adicional: "Adicional",
      volta: "Volta",
    };

    const $ = (s) => document.querySelector(s);
    let tipoAtual = "entrada";
    let itens = [];
    let html5QrCode = null;
    let lastScanAt = 0;

    function hojeISO() {
      const d = new Date();
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function formatarDataBR(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return `${d}/${m}/${y}`;
    }

    function formatKg(n) {
      return Number(n).toLocaleString("pt-BR", {
        minimumFractionDigits: 3,
        maximumFractionDigits: 3,
      });
    }

    function nomeProduto(codigo) {
      const c = String(codigo);
      return PRODUTOS[c] || PRODUTOS_EXTRA[c] || `Produto ${c}`;
    }

    /**
     * Etiqueta Toledo EAN-13 peso:
     * 2 + PLU(6) + peso*1000(5) + dígito verificador
     * Ex: 2111700029463 → PLU 111700 → 1117 / 2,946 kg
     */
    function parseBarcode(raw) {
      const digits = String(raw).replace(/\D/g, "");
      if (digits.length < 12) {
        return { ok: false, erro: "Código incompleto" };
      }

      const code13 = digits.length >= 13 ? digits.slice(0, 13) : digits.padStart(13, "0");
      if (!code13.startsWith("2")) {
        return { ok: false, erro: "Não parece etiqueta de peso (não começa com 2)" };
      }

      const pluRaw = code13.slice(1, 7);
      const pesoRaw = code13.slice(7, 12);
      const peso = parseInt(pesoRaw, 10) / 1000;
      const codigo = resolverCodigo(pluRaw);

      if (!codigo || Number.isNaN(peso)) {
        return { ok: false, erro: "Não consegui ler produto/peso" };
      }

      return {
        ok: true,
        barcode: code13,
        codigo,
        produto: nomeProduto(codigo),
        peso,
        pluRaw,
      };
    }

    function resolverCodigo(plu6) {
      const n = String(parseInt(plu6, 10));
      const mapa = { ...PRODUTOS, ...PRODUTOS_EXTRA };
      if (mapa[n]) return n;
      const trimmed = n.replace(/0+$/, "");
      if (trimmed && mapa[trimmed]) return trimmed;
      for (const cod of Object.keys(mapa)) {
        if (n === cod.padStart(6, "0") || n.startsWith(cod) || cod.startsWith(n)) {
          return cod;
        }
      }
      return trimmed || n;
    }

    function uid() {
      return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function lerEstado() {
      return {
        data: $("#data").value || hojeISO(),
        quem: $("#quem").value.trim(),
        itens,
      };
    }

    function salvar() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lerEstado()));
    }

    function carregar() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      } catch {
        return null;
      }
    }

    function adicionarLeitura(parsed) {
      const agora = new Date();
      const item = {
        id: uid(),
        barcode: parsed.barcode,
        codigo: parsed.codigo,
        produto: parsed.produto,
        peso: parsed.peso,
        tipo: tipoAtual,
        hora: agora.toTimeString().slice(0, 5),
      };
      itens.unshift(item);
      salvar();
      render();
      toast(`${parsed.produto} · ${formatKg(parsed.peso)} kg`);
      beep();
    }

    function processarCodigo(raw) {
      const parsed = parseBarcode(raw);
      if (!parsed.ok) {
        toast(parsed.erro, true);
        return false;
      }
      const dup = itens.find((i) => i.barcode === parsed.barcode && i.tipo === tipoAtual);
      if (dup) {
        toast("Essa etiqueta já está na lista deste tipo", true);
        return false;
      }
      adicionarLeitura(parsed);
      return true;
    }

    function remover(id) {
      itens = itens.filter((i) => i.id !== id);
      salvar();
      render();
    }

    function textoLista() {
      const { data, quem, itens: lista } = lerEstado();
      const linhas = [
        `*Coletagem Frios — ${formatarDataBR(data)}*`,
      ];
      if (quem) linhas.push(`Quem: ${quem}`);
      linhas.push(`Etiquetas: ${lista.length}`);
      linhas.push("");

      ["entrada", "adicional", "volta"].forEach((tipo) => {
        const grupo = lista.filter((i) => i.tipo === tipo);
        if (!grupo.length) return;
        const soma = grupo.reduce((s, i) => s + i.peso, 0);
        linhas.push(`*${TIPO_LABEL[tipo]}* (${grupo.length} · ${formatKg(soma)} kg)`);
        grupo.forEach((i, idx) => {
          linhas.push(
            `${idx + 1}. ${i.produto} (${i.codigo}) — ${formatKg(i.peso)} kg · ${i.hora}`
          );
        });
        linhas.push("");
      });

      const porProduto = {};
      lista.forEach((i) => {
        const k = `${i.codigo}|${i.produto}`;
        if (!porProduto[k]) porProduto[k] = 0;
        porProduto[k] += i.peso;
      });
      const keys = Object.keys(porProduto);
      if (keys.length) {
        linhas.push("*Totais por produto*");
        keys.forEach((k) => {
          const [, nome] = k.split("|");
          linhas.push(`- ${nome}: ${formatKg(porProduto[k])} kg`);
        });
      }

      return linhas.join("\n").trim();
    }

    function render() {
      const lista = $("#lista");
      $("#totalQtd").textContent = String(itens.length);
      const soma = itens.reduce((s, i) => s + i.peso, 0);
      $("#totalKg").textContent = `${formatKg(soma)} kg`;
      $("#preview").textContent = textoLista();

      if (!itens.length) {
        lista.innerHTML = `<div class="empty">Nenhuma etiqueta ainda.<br/>Bipa ou digita o código.</div>`;
        return;
      }

      lista.innerHTML = itens
        .map(
          (i) => `
        <div class="item">
          <div>
            <div class="nome">${esc(i.produto)}</div>
            <div class="meta-line">Cód. ${esc(i.codigo)} · ${esc(i.barcode)} · ${esc(i.hora)}</div>
            <span class="badge ${i.tipo}">${TIPO_LABEL[i.tipo]}</span>
          </div>
          <div class="peso">${formatKg(i.peso)} kg</div>
          <div class="item-actions">
            <button type="button" data-del="${i.id}">Remover</button>
          </div>
        </div>
      `
        )
        .join("");
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toast(msg, warn) {
      const el = $("#toast");
      el.textContent = msg;
      el.classList.toggle("warn", !!warn);
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.frequency.value = 880;
        g.gain.value = 0.04;
        o.start();
        setTimeout(() => {
          o.stop();
          ctx.close();
        }, 80);
      } catch (_) {}
    }

    async function copiar() {
      const texto = textoLista();
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(texto);
        } else {
          const ta = document.createElement("textarea");
          ta.value = texto;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        toast("Lista copiada");
      } catch {
        toast("Não deu pra copiar — selecione a prévia", true);
      }
    }

    function limpar() {
      if (!itens.length) {
        toast("Lista já está vazia");
        return;
      }
      if (!confirm("Apagar todas as etiquetas deste dia?")) return;
      itens = [];
      $("#data").value = hojeISO();
      salvar();
      render();
      toast("Dia limpo");
    }

    async function abrirCamera() {
      if (!window.Html5Qrcode) {
        toast("Scanner não carregou — use digitação", true);
        return;
      }
      if (html5QrCode) return;

      const reader = $("#reader");
      reader.classList.add("active");
      html5QrCode = new Html5Qrcode("reader");

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 8, qrbox: { width: 260, height: 140 }, aspectRatio: 1.4 },
          (decoded) => {
            const now = Date.now();
            if (now - lastScanAt < 1600) return;
            lastScanAt = now;
            if (processarCodigo(decoded)) {
              $("#codigoManual").value = "";
            }
          },
          () => {}
        );
        $("#btnCam").disabled = true;
        $("#btnStopCam").disabled = false;
      } catch (err) {
        reader.classList.remove("active");
        html5QrCode = null;
        toast("Sem acesso à câmera — digite o código", true);
      }
    }

    async function pararCamera() {
      if (!html5QrCode) return;
      try {
        await html5QrCode.stop();
        await html5QrCode.clear();
      } catch (_) {}
      html5QrCode = null;
      $("#reader").classList.remove("active");
      $("#btnCam").disabled = false;
      $("#btnStopCam").disabled = true;
    }

    // --- init ---
    const salvo = carregar();
    $("#data").value = salvo?.data || hojeISO();
    $("#quem").value = salvo?.quem || "";
    itens = Array.isArray(salvo?.itens) ? salvo.itens : [];
    render();

    $("#tipoTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-tipo]");
      if (!btn) return;
      tipoAtual = btn.dataset.tipo;
      $("#tipoTabs").querySelectorAll("button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
    });

    $("#btnAdd").addEventListener("click", () => {
      const raw = $("#codigoManual").value.trim();
      if (!raw) {
        toast("Digite ou cole o código", true);
        return;
      }
      if (processarCodigo(raw)) $("#codigoManual").value = "";
      $("#codigoManual").focus();
    });

    $("#codigoManual").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        $("#btnAdd").click();
      }
    });

    $("#lista").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-del]");
      if (!btn) return;
      remover(btn.dataset.del);
    });

    $("#data").addEventListener("change", () => {
      salvar();
      render();
    });
    $("#quem").addEventListener("input", () => {
      salvar();
      render();
    });

    $("#btnCam").addEventListener("click", abrirCamera);
    $("#btnStopCam").addEventListener("click", pararCamera);
    $("#btnCopy").addEventListener("click", copiar);
    $("#btnClear").addEventListener("click", limpar);

    window.addEventListener("beforeunload", () => {
      pararCamera();
    });
  </script>
</body>
</html>
