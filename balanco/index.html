<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Balanço · Trevo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8f2ec;
      --bg-deep: #d4e8dc;
      --ink: #0f2a22;
      --ink-soft: #3d5c52;
      --leaf: #1a6b4a;
      --leaf-deep: #0b3d2e;
      --cream: #f7fbf8;
      --line: #b8d4c6;
      --warn: #9a5b1a;
      --danger: #9b2e2e;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100dvh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 120% 80% at 10% -20%, #c5e4d4 0%, transparent 55%),
        radial-gradient(ellipse 90% 60% at 100% 0%, #dceee4 0%, transparent 45%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      padding: calc(0.9rem + var(--safe-top)) 0.85rem calc(1.25rem + var(--safe-bottom));
    }

    .wrap {
      max-width: 28rem;
      margin: 0 auto;
    }

    header { margin-bottom: 0.85rem; animation: rise 0.4s ease-out both; }

    .brand {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--leaf-deep);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand span {
      font-weight: 600;
      color: var(--leaf);
      font-size: 1rem;
      margin-left: 0.3rem;
    }

    .subtitle {
      margin-top: 0.25rem;
      font-size: 0.9rem;
      color: var(--ink-soft);
      line-height: 1.35;
    }

    details.panel {
      background: var(--cream);
      border: 1.5px solid var(--line);
      border-radius: 0.85rem;
      margin-bottom: 0.65rem;
      overflow: hidden;
    }

    details.panel summary {
      list-style: none;
      cursor: pointer;
      padding: 0.75rem 0.9rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--leaf-deep);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    details.panel summary::-webkit-details-marker { display: none; }

    details.panel summary::after {
      content: "+";
      float: right;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink-soft);
      line-height: 1;
    }

    details.panel[open] summary::after { content: "−"; }

    details.panel .panel-body {
      padding: 0 0.85rem 0.85rem;
      border-top: 1px solid var(--line);
      padding-top: 0.75rem;
    }

    .toolbar label,
    .field-label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
    }

    .toolbar input,
    .toolbar select,
    .card input {
      font: inherit;
      font-size: 1rem;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      color: var(--ink);
      background: #eef7f2;
      border: 1.5px solid var(--line);
      border-radius: 0.65rem;
      padding: 0.7rem 0.7rem;
      width: 100%;
      -webkit-appearance: none;
    }

    .toolbar input:focus,
    .toolbar select:focus,
    .card input:focus,
    .filter-row input:focus {
      outline: 2px solid var(--leaf);
      outline-offset: 1px;
      border-color: var(--leaf);
      background: #fff;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .toolbar .grow { grid-column: 1 / -1; }
    .toolbar .full { grid-column: 1 / -1; }

    .filter-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.7rem;
      align-items: center;
      position: sticky;
      top: calc(0.35rem + var(--safe-top));
      z-index: 5;
      padding: 0.35rem 0;
      background: linear-gradient(180deg, var(--bg) 60%, transparent);
    }

    .filter-row input {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 1rem;
      background: var(--cream);
      border: 1.5px solid var(--line);
      border-radius: 0.75rem;
      padding: 0.75rem 0.85rem;
      color: var(--ink);
      box-shadow: 0 4px 14px rgba(11, 61, 46, 0.06);
    }

    .chip {
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--leaf-deep);
      background: var(--cream);
      border: 1.5px solid var(--line);
      border-radius: 999px;
      padding: 0.55rem 0.7rem;
      white-space: nowrap;
    }

    .lista {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .card {
      background: var(--cream);
      border: 1.5px solid var(--line);
      border-radius: 0.95rem;
      padding: 0.85rem 0.9rem;
      animation: rise 0.35s ease-out both;
    }

    .card.zero { opacity: 0.55; }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.7rem;
    }

    .card-idx {
      flex-shrink: 0;
      width: 1.55rem;
      height: 1.55rem;
      display: grid;
      place-items: center;
      border-radius: 0.45rem;
      background: rgba(26, 107, 74, 0.1);
      color: var(--leaf);
      font-size: 0.72rem;
      font-weight: 800;
      margin-top: 0.1rem;
    }

    .card-title {
      flex: 1;
      min-width: 0;
    }

    .card-code {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--leaf);
      letter-spacing: 0.02em;
      margin-bottom: 0.1rem;
    }

    .card-name {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--ink);
      word-break: break-word;
    }

    .medida {
      flex-shrink: 0;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--leaf);
      background: rgba(26, 107, 74, 0.12);
      border-radius: 0.4rem;
      padding: 0.3rem 0.45rem;
      margin-top: 0.1rem;
    }

    .btn-icon {
      flex-shrink: 0;
      border: none;
      background: rgba(155, 46, 46, 0.08);
      color: var(--danger);
      font-size: 1.15rem;
      cursor: pointer;
      width: 2rem;
      height: 2rem;
      border-radius: 0.5rem;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }

    .card-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }

    .card input[type="number"] {
      font-size: 1.25rem;
      font-weight: 800;
      text-align: center;
      color: var(--leaf-deep);
      padding: 0.75rem 0.4rem;
      min-height: 3rem;
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }

    .card input[type="number"]::-webkit-outer-spin-button,
    .card input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .card-result {
      margin-top: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0.7rem;
      background: rgba(11, 61, 46, 0.06);
      border-radius: 0.65rem;
    }

    .conta-cell {
      font-variant-numeric: tabular-nums;
      font-size: 0.88rem;
      color: var(--ink-soft);
      font-weight: 600;
    }

    .conta-cell .op {
      margin: 0 0.15rem;
      opacity: 0.7;
    }

    .total-cell {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--leaf-deep);
      white-space: nowrap;
      font-size: 1.05rem;
    }

    .total-cell em {
      font-style: normal;
      font-weight: 600;
      font-size: 0.78rem;
      color: var(--ink-soft);
      margin-left: 0.2rem;
    }

    .total-cell.contagem {
      color: var(--ink-soft);
      font-weight: 700;
    }

    button.btn {
      font: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      border-radius: 0.85rem;
      padding: 0.85rem 0.55rem;
      cursor: pointer;
      transition: transform 0.12s ease;
      -webkit-tap-highlight-color: transparent;
      min-height: 2.85rem;
    }

    button.btn:active { transform: scale(0.97); }

    .btn-leaf {
      background: var(--leaf);
      color: #f0faf5;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(1.25rem + var(--safe-bottom));
      transform: translateX(-50%) translateY(0.5rem);
      background: var(--leaf-deep);
      color: #f0faf5;
      font-weight: 600;
      font-size: 0.88rem;
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 20;
      max-width: calc(100vw - 2rem);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.warn { background: var(--warn); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 720px) {
      body { padding-left: 1.25rem; padding-right: 1.25rem; }
      .wrap { max-width: 36rem; }
      .brand { font-size: 1.85rem; }
    }
  </style>
</head>

  <div class="wrap">
    <header>

    <div class="filter-row">

              <option>UN</option>
              <option>PCT</option>
              <option>CX</option>
              <option>LT</option>

          </label>
          <label class="grow">Produto

          </label>
          <label>Kg de cada un
            <input type="number" id="newPeso" min="0" step="any" value="1" inputmode="decimal" />
          </label>
          <button type="button" class="btn btn-leaf full" id="btnAdd">Adicionar na lista</button>
        </div>
      </div>
    </details>

    <div class="lista" id="lista"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>

      { codigo: "956", nome: "LEITE CONDENSADO ZERO LACTOSE", medida: "KG", qtdPapel: 0.79 },
      { codigo: "964", nome: "REFIL MOP", medida: "UN", qtdPapel: 0 },
      { codigo: "967", nome: "ETIQUETA ADESIVA EM PAPEL TS 38X40MM", medida: "UN", qtdPapel: 0 },
      { codigo: "982", nome: "ACAI 0% ACUCAR CX 20KG", medida: "KG", qtdPapel: 20 },
    ];

    const $ = (s) => document.querySelector(s);

    function inferPesoUn(nome) {
      const n = String(nome || "").toUpperCase();
      const m20 = n.match(/CX\s*20\s*KG/);
      if (m20) return 20;
      const m5 = n.match(/CX\s*5\s*KG/);
      if (m5) return 5;
      return 1;
    }

    /** Converte anotação da folha → qtd contada + peso/un, mantendo o total do papel. */
    function seedFromPapel(item) {
      const fator = inferPesoUn(item.nome);
      const papel = item.qtdPapel;
      if (papel == null || Number.isNaN(papel)) {
        return { qtd: "", pesoUn: fator };
      }
      if (fator > 1 && papel >= fator) {
        const qtd = papel / fator;
        return { qtd: roundNum(qtd), pesoUn: fator };
      }
      return { qtd: papel, pesoUn: fator > 1 && papel < fator ? 1 : fator };
    }

    function roundNum(n) {
      const r = Math.round(n * 1000) / 1000;
      return Object.is(r, -0) ? 0 : r;
    }

    function uid() {
      return "p_" + Math.random().toString(36).slice(2, 10);
    }

    function produtosIniciais() {
      return FOLHA.map((item, i) => {
        const seed = seedFromPapel(item);
        return {
          id: uid(),
          codigo: item.codigo,
          nome: item.nome,
          medida: item.medida,
          qtd: seed.qtd === "" ? "" : seed.qtd,
          pesoUn: seed.pesoUn,
          ordem: i,
        };
      });
    }

    let state = {
      produtos: produtosIniciais(),
    };

    /** Vira kg se for medida KG, ou se a pessoa setou kg/un ≠ 1 (ex.: bag 2 kg). */
    function viraKg(p) {
      const w = parseNum(p.pesoUn);
      if (String(p.medida).toUpperCase() === "KG") return true;
      return w != null && w !== 1;
    }

    function kgPorUn(p) {
      const w = parseNum(p.pesoUn);
      if (w == null) return 1;
      return w;
    }

    /** Resultado em kg quando aplica; senão null (é só contagem). */
    function totalKg(p) {
      if (!viraKg(p)) return null;
      const q = parseNum(p.qtd);
      if (q == null) return null;
      return roundNum(q * kgPorUn(p));
    }

    function htmlConta(p) {
      const q = parseNum(p.qtd);
      if (q == null) return "—";
      const w = kgPorUn(p);
      if (!viraKg(p)) {
        return `${formatNum(q)} <span class="op">·</span> ${escapeHtml(p.medida)}`;
      }
      if (w === 1) {
        return `${formatNum(q)} <span class="op">×</span> 1`;
      }
      return `${formatNum(q)} <span class="op">×</span> ${formatNum(w)}`;
    }

    function htmlResultado(p) {
      const q = parseNum(p.qtd);
      if (q == null) return "—";
      if (!viraKg(p)) {
        return `<span class="total-cell contagem">${formatNum(q)}<em>${escapeHtml(p.medida)}</em></span>`;
      }
      const tot = totalKg(p);
      return `<span class="total-cell">${formatNum(tot)}<em>kg</em></span>`;
    }

    function parseNum(v) {
      if (v === "" || v == null) return null;
      const n = typeof v === "number" ? v : parseFloat(String(v).replace(",", "."));
      return Number.isFinite(n) ? n : null;
    }

    function formatNum(n) {
      if (n == null || Number.isNaN(n)) return "—";
      return n.toLocaleString("pt-BR", {
        maximumFractionDigits: 3,
      });
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!saved || !Array.isArray(saved.produtos) || !saved.produtos.length) return;
        state = {
          produtos: saved.produtos.map((p, i) => ({
            id: p.id || uid(),
            codigo: String(p.codigo ?? ""),
            nome: String(p.nome ?? ""),
            medida: String(p.medida || "KG"),
            qtd: p.qtd === "" || p.qtd == null ? "" : p.qtd,
            pesoUn: parseNum(p.pesoUn) ?? 1,
            ordem: p.ordem ?? i,
          })),
        };
      } catch {
        /* ignore */
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function filtrados() {
      const q = ($("#busca").value || "").trim().toLowerCase();
      const list = [...state.produtos].sort((a, b) => a.ordem - b.ordem);
      if (!q) return list;
      return list.filter(
        (p) =>
          String(p.codigo).toLowerCase().includes(q) ||
          String(p.nome).toLowerCase().includes(q)
      );
    }

    function render() {
      const list = filtrados();
      const lista = $("#lista");
      lista.innerHTML = "";

      list.forEach((p, idx) => {
        const qNum = parseNum(p.qtd);
        const card = document.createElement("article");
        card.className = "card" + (qNum === 0 ? " zero" : "");
        card.dataset.id = p.id;
        card.innerHTML = `
          <div class="card-top">
            <span class="card-idx">${idx + 1}</span>
            <div class="card-title">
              <div class="card-code">${escapeHtml(p.codigo)}</div>
              <div class="card-name">${escapeHtml(p.nome)}</div>
            </div>
            <span class="medida">${escapeHtml(p.medida)}</span>
            <button type="button" class="btn-icon" data-del title="Remover" aria-label="Remover">×</button>
          </div>
          <div class="card-fields">
            <label class="field-label">Contagem
              <input data-f="qtd" type="number" inputmode="decimal" step="any" min="0" value="${p.qtd === "" || p.qtd == null ? "" : p.qtd}" placeholder="0" />
            </label>
            <label class="field-label">Kg de cada un
              <input data-f="pesoUn" type="number" inputmode="decimal" step="any" min="0" value="${p.pesoUn}" />
            </label>
          </div>
          <div class="card-result">
            <span class="conta-cell" data-conta>${htmlConta(p)}</span>
            <span data-resultado>${htmlResultado(p)}</span>
          </div>
        `;
        lista.appendChild(card);
      });

      $("#chipCount").textContent = String(list.length);
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function findById(id) {
      return state.produtos.find((p) => p.id === id);
    }

    function toast(msg, warn) {
      const el = $("#toast");
      el.textContent = msg;
      el.classList.toggle("warn", !!warn);
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function adicionarProduto() {
      const codigo = $("#newCodigo").value.trim();
      const nome = $("#newNome").value.trim();
      const medida = $("#newMedida").value;
      let pesoUn = parseNum($("#newPeso").value);
      if (!nome) {
        toast("Digite o nome do produto", true);
        return;
      }
      if (pesoUn == null || pesoUn < 0) pesoUn = inferPesoUn(nome);
      const maxOrdem = state.produtos.reduce((m, p) => Math.max(m, p.ordem), -1);
      state.produtos.push({
        id: uid(),
        codigo: codigo || String(maxOrdem + 2),
        nome: nome.toUpperCase(),
        medida,
        qtd: "",
        pesoUn: pesoUn || 1,
        ordem: maxOrdem + 1,
      });
      $("#newCodigo").value = "";
      $("#newNome").value = "";
      $("#newPeso").value = String(inferPesoUn(nome) || 1);
      save();
      render();
      toast("Produto adicionado");
    }

    $("#lista").addEventListener("input", (e) => {
      const input = e.target.closest("input[data-f]");
      if (!input) return;
      const card = input.closest(".card");
      const p = findById(card.dataset.id);
      if (!p) return;
      const f = input.dataset.f;
      if (f === "qtd") {
        p.qtd = input.value === "" ? "" : input.value;
      } else if (f === "pesoUn") {
        const n = parseNum(input.value);
        p.pesoUn = n == null ? 0 : n;
      }
      const conta = card.querySelector("[data-conta]");
      const resultado = card.querySelector("[data-resultado]");
      if (conta) conta.innerHTML = htmlConta(p);
      if (resultado) resultado.innerHTML = htmlResultado(p);
      const qNum = parseNum(p.qtd);
      card.classList.toggle("zero", qNum === 0);
      save();
    });

    $("#lista").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-del]");
      if (!btn) return;
      const card = btn.closest(".card");
      const p = findById(card.dataset.id);
      if (!p) return;
      if (!confirm(`Remover ${p.codigo} ${p.nome}?`)) return;
      state.produtos = state.produtos.filter((x) => x.id !== p.id);
      save();
      render();
      toast("Removido");
    });

    $("#newNome").addEventListener("input", () => {
      const sugerido = inferPesoUn($("#newNome").value);
      if (document.activeElement !== $("#newPeso")) {
        $("#newPeso").value = String(sugerido);
      }
    });

    $("#busca").addEventListener("input", render);
    $("#btnAdd").addEventListener("click", adicionarProduto);
    $("#newNome").addEventListener("keydown", (e) => {
      if (e.key === "Enter") adicionarProduto();
    });

    load();
    render();
  </script>
</body>
</html>
